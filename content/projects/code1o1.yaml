    label: hours taught
context: Co-founded with Aditya Vaishnav · April 2025 to present · 1:1 and small-group coding classes for Grade 5 to college students, online and at home
answer: Trust converts, reach doesn't. About 1% of cold calls became clients, but every home visit did. Growth is capped by teaching time, not demand.
problem: School computer science in India is mostly theory, so kids lose interest before they build anything. Code1o1 teaches through a real project from the first session.
did:
  - Designed all 11 courses and their teaching materials.
  - Built the lead list and wrote the cold-call script; split calling with Aditya and led most of the closing, including in-home consultations.
  - Hired and managed 3 interns.
  - Teach 1:1, about 4–5 hours a week.
