tools: [ Python, PCA, K-Means, Next.js ]
problem: "Goals and assists flatten very different winger jobs into one column. Can we identify and quantify the different ways wingers contribute in attack?"
did:
  - "Defined a consistent winger population across five leagues and seven seasons: 1,396 player–club–season spells from 665 footballers."
  - "Screened 27 candidate measures down to 20 behavioural features across eight families, standardized over all spells."
  - "Used PCA to map variation, all 20 measures for similarity, and K-Means for five descriptive styles; tested three alternative specifications."
  - "Found a continuum rather than distinct types (silhouette ≈0.149) and built an interactive explorer to make the results explorable."
