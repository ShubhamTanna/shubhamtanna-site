cardTitle: "Tata Motors: two fixes worth ₹70–120 Cr a year"
cardLine: How Tata Motors nearly tripled its market share through segmentation, and three fixes for its weak spot, after-sales service. The two sized fixes are worth an estimated ₹70–120 Cr a year.
