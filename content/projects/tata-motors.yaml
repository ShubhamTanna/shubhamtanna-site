    label: a year, from the two sized fixes
context: Marketing Management, Semester 7, 2025 · 6-person team; I owned the Tata Motors workstream
answer: Tata's turnaround was built on safety and trust. Fix after-sales service, which undermines both, with a service subscription, paid over-the-air upgrades and a cross-group loyalty tier.
problem: Tata's turnaround was built on safety and trust, but weak after-sales service undermines both.
did:
  - Researched the market and built the segmentation and targeting analysis.
  - Designed the three recommendations and sized their revenue.
  - Wrote the Tata Motors report section and slides.
results:
  - caption: Where Tata stands
    columns:
      - Measure
      - Value
    rows:
      - - Market share
        - About 5% (FY20) to about 14% (FY23)
      - - Rank
        - "#3, within 9,220 units of Hyundai in H1 FY23"
      - - Share of India's passenger-EV market
        - Over 73%
  - caption: How the segmentation worked
    columns:
      - Variable
      - Target group
      - Models
      - Why it worked
    rows:
      - - Demographic / geographic
        - Aspirational ladder (income, age, location)
        - Tiago (entry), Nexon/Altroz (mid), Safari/Harrier (premium)
        - A clear product ladder lets buyers enter affordably and upgrade within the brand
      - - Psychographic
        - Safety-conscious family
        - Entire 'New Forever' range (5-star NCAP)
        - Answered the old poor-quality perception with family safety instead of a features war
      - - Behavioural
        - Early adopters and eco-conscious buyers
        - Nexon EV, Tiago EV, Punch EV
        - First-mover advantage leapfrogged the technology gap; over 73% of the passenger-EV market
      - - Psychographic / geographic
        - "'Vocal for Local' patriot"
        - Entire portfolio (homegrown engineering)
        - Turned being 'too Indianised' into national pride and trust
    source: report section 1; report sections 1 and 3
