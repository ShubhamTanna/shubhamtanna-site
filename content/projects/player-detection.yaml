context: Cognitive Sciences and Analytics course, Semester 7, 2025 · v1 built on Roboflow; rebuilt end to end in Python in 2026 (v2) · Solo
answer: A small model can pull usable detections straight from broadcast frames on an ordinary CPU. Choosing the inference resolution on validation data lifted ball detection from 0.29 to 0.43 without retraining, and the rebuilt model matches v1 overall while beating it on 3 of 4 classes.
problem: Tracking data normally needs expensive camera systems or manual tagging. Can a small model get usable detections straight from broadcast frames, on an ordinary CPU?
did:
  - Fine-tuned YOLOv8-nano on 372 labelled frames (Roboflow public dataset, CC BY 4.0).
  - Chose the inference resolution on validation data, which lifted ball accuracy by half without retraining.
  - Built team identification (jersey-colour clustering) and a possession estimate (nearest player to the ball).
results:
  - caption: Setup
    columns:
      - ""
      - ""
    rows:
      - - Model
        - YOLOv8-nano, 3,133,436 parameters, fine-tuned from COCO weights
