work:
  - org: Yocket
    sub: Postgraduate sales team · Mumbai
    role: Business Operations Intern
    dates: Sep – Dec 2026
    current: true
    line: Finding and fixing leaks in a study-abroad sales funnel, from the moment a lead reaches a sales advisor, through the consultation, to the close.
    owned:
      - title: Call audits
        text: "I audit consultation calls for the Sales team leader. I redesigned the audit format: six scored dimensions, the moments that went well, the ones that didn't, the chances missed, and one thing the advisor should do next time. Now I'm automating it: Whisper transcribes, an LLM drafts, and I review before anything is final."
      - title: No-show research
        text: "Full ownership of a problem the team couldn't explain: why leads book a consultation and never show up. I designed the questions and the call approach, and I'm building personas of no-shows and attendees, on a target of 200–300 call attempts a week."
      - title: Re-engagement campaign
        text: Emails for leads who've been cold for 180+ days. Four concepts, from an advisor's "your file is on my desk" to a letter from past you, each in a creative and a plain version.
      - title: Funnel tools
        text: "Built on my own initiative: a speed-to-lead tracker, a map of where leads drop off by source and stage, and tags that link audit findings to those drop-offs."
    note: Results in progress. Numbers go here once the research lands.
    tools:
      - LeadSquared CRM
      - Google Sheets
      - Whisper
      - LLMs
