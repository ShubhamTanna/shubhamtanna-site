lede: I co-founded Code1o1, a coding academy in Mumbai, and grew it to 14 paying clients without spending on ads. Right now I'm a Business Operations Intern at Yocket, finding and fixing leaks in a study-abroad sales funnel.
body:
  - "I studied Computer Science and Business Systems at NMIMS. The work I like most sits between the two: pricing a plan, sizing a market, or building a model and asking what it means for the decision."
whyConsulting: "Every role I’ve enjoyed had the same shape: an unclear problem, a decision someone had to make, and the job of getting to the answer with real numbers. Consulting is that shape, full time. I do my best work when I own a problem from a blank page, and I’d rather be stretched by hard problems than comfortable in easy ones."
