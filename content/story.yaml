  - key: next
    title: Next
    years: 2026 →
    pull: One business taught me the basics. I want bigger problems.
    text: Management consulting, strategy and decision analytics. I've done this at the scale of one business. I want the bigger ones.
    long:
      - "I finished my B.Tech in Computer Science and Business Systems at NMIMS in 2026. Right now I’m a Business Operations Intern at Yocket: auditing sales calls, researching why leads don’t show up, and building the tools that show where the funnel leaks."
      - Next, I want management consulting, strategy consulting or decision analytics. I’ve solved problems at the scale of one business I helped build. I want harder problems, and the people who solve them every day.
