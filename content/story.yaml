        source: Code1o1 · co-founder
        href: /work/code1o1
      - value: "14"
        what: paying clients, ₹0 spent on ads
        source: Code1o1
        href: /work/code1o1
      - value: 3,000+
        what: footfall against a 2,000 target
        source: Sattva, NMIMS · Head of Publicity
