  - key: sell
    title: Sell
    years: 2022–now
    pull: 2,500 cold calls taught me what actually converts.
    text: "About 2,500 cold calls: for college events, at a Jaguar Land Rover showroom, for Code1o1. At Code1o1, about 1% of calls became clients. Every home visit did. Trust converts. Reach doesn't."
    long:
      - I learned to sell in college, filling seats. As Vice Chairperson of Social Conclave I set targets for a 78-person team and took paid registrations from 81 to 331. At BizDateUp I sold 40+ premium tickets at ₹5,000 each and negotiated venue contracts with The Lalit, JW Marriott and Novotel.
      - "Then Code1o1, where the product was me. About 500 cold calls brought in 4 or 5 clients, roughly 1%. Four home visits brought in four. That gap taught me the most useful thing I know about selling: trust converts, reach doesn’t."
      - At the Jaguar Land Rover showroom in Worli I prospected high-net-worth buyers and closed a booking before my formal floor training. Sales isn’t where I’m headed. What I kept from it is the habit of finding out what the other person actually needs before I say anything.
