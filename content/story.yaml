  - key: price
    title: Price
    years: 2025–now
    pull: Every price is a decision someone will push back on.
    text: I priced 11 courses for parents deciding whether coding classes were worth paying for at all. Revenue came to about ₹18,600 per client, about ₹650 for every hour taught.
    long:
      - Parents weren’t comparing Code1o1 with another coding class. They were deciding whether coding classes were worth paying for at all.
      - I priced 11 courses against that question. Revenue came to about ₹18,600 per client and about ₹650 for every hour taught, and a 5-student summer camp brought in ₹35,000.
      - Pricing came up again in college. On Aur Sunao, a peer-listening app, our ₹499 flagship plan bundled ₹1,170 of pay-per-use value and lost ₹262 on every subscriber. I rebuilt the unit economics, kept the price, cut what the plan included, and turned it into +₹154 a subscriber.
