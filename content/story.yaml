# The six story chapters. `text` is the short version (Home and Story page).
# `long` is your longer story: a list of paragraphs. Empty = a 'your story goes here' note shows in development only.

chapters:
  - key: build
    title: Build
    years: 2025–now
    pull: I started a company before I finished my degree.
    text: April 2025. I co-founded Code1o1 with Aditya Vaishnav and took it from zero to 14 paying clients and about ₹2.6L in revenue, without spending on ads.
    long:
      - "School computer science in India is mostly theory, so kids lose interest before they build anything. In April 2025, Aditya Vaishnav and I started Code1o1 to fix that: coding classes where every student builds a real project from the first session, 1:1 or in small groups, from Grade 5 to college."
      - We split the work the way two founders with no money have to. I designed all 11 courses and their materials, wrote the cold-call script and closed most of the deals. Aditya built the website and ran the interns’ creative work. We both teach. Along the way I hired and managed 3 interns.
      - No ads, no funding. 14 paying clients and about ₹2.6L in revenue came from cold calls, home visits, referrals and a school collaboration. Today it runs on weekends with our existing students.
    photo:
      src: /img/build.jpg
      alt: The Code1o1 stall
      caption: The Code1o1 stall
    proof:
