  - key: teach
    title: Teach
    years: 2023–now
    pull: It started as volunteering. It became a company.
    text: "It started in 2023, volunteering with Spark-A-Change, teaching English and maths to underprivileged kids. Two years later, that is why I started Code1o1. Since then: 16 students, Grade 5 to college, about 400 hours, and I still teach 1:1 every week."
    long:
      - In the summer of 2023 I volunteered with Spark-A-Change, teaching English and maths to underprivileged children.
      - That summer is why Code1o1 exists. Two years later, I wanted to teach again, properly, and to build something that could pay for itself.
      - Since then I’ve taught 16 students, from Grade 5 to college, for about 400 hours. Every course ends in a project the student built; in the Python in Finance course, it’s a Monte Carlo simulation of a stock portfolio. I still teach 4 to 5 hours a week.
